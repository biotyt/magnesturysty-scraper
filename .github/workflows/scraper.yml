name: MagnesTurysty Scraper

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Pobierz kod z repozytorium
        uses: actions/checkout@v4

      - name: Ustaw Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Zainstaluj zależności
        run: pip install requests beautifulsoup4 gspread google-auth

      - name: Utwórz plik credentials z Secret
        run: echo '${{ secrets.GOOGLE_CREDENTIALS }}' > google_credentials.json

      - name: Uruchom scraper i wygeneruj mapę
        run: python magnes_turysty_scraper.py

      - name: Usuń credentials przed publikacją
        run: rm -f google_credentials.json

      - name: Sprawdź czy index.html istnieje
        run: |
          if [ -f index.html ]; then
            echo "index.html istnieje - rozmiar: $(wc -c < index.html) bajtów"
          else
            echo "BŁĄD: index.html nie został wygenerowany!"
            exit 1
          fi

      - name: Opublikuj mapę na GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          publish_branch: gh-pages
          include_files: index.html
