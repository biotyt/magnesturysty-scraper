name: MagnesTurysty Scraper

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Pobierz kod z repozytorium
        uses: actions/checkout@v4

      - name: Ustaw Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Zainstaluj zależności
        run: pip install requests beautifulsoup4 gspread google-auth

      - name: Utwórz plik credentials z Secret
        run: echo '${{ secrets.GOOGLE_CREDENTIALS }}' > google_credentials.json

      - name: Uruchom scraper i wygeneruj mapę
        run: python magnes_turysty_scraper.py

      - name: Przygotuj folder do publikacji
        run: |
          mkdir -p publish
          cp index.html publish/
          echo "Zawartość folderu publish:"
          ls -la publish/

      - name: Opublikuj mapę na GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./publish
          publish_branch: gh-pages
