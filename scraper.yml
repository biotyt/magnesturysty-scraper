name: MagnesTurysty Scraper

on:
  schedule:
    - cron: '0 0 * * *'   # każdą noc o 00:00 UTC (02:00 czasu polskiego)
  workflow_dispatch:        # możliwość ręcznego uruchomienia z GitHub

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Pobierz kod z repozytorium
        uses: actions/checkout@v4

      - name: Ustaw Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Zainstaluj zależności
        run: pip install requests beautifulsoup4 gspread google-auth

      - name: Utwórz plik credentials z Secret
        run: echo '${{ secrets.GOOGLE_CREDENTIALS }}' > google_credentials.json

      - name: Uruchom scraper
        run: python magnes_turysty_scraper.py
